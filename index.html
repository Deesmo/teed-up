<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve to real values -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e0c">
<meta name="description" content="Teed Up — book private golf clubs as the verified guest of a member.">
<link rel="icon" type="image/svg+xml" href="assets/app-icon.svg">
<link rel="preload" as="image" href="assets/hero.jpg">
<title>Teed Up — get inside the ropes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e0c; --card:#141a16; --card2:#1a2119;
  --line:rgba(255,255,255,.09); --line-g:rgba(201,162,75,.22);
  --cream:#f2eee4; --muted:#93a498; --dim:#68766b; --dim2:#7d8c81;
  --gold:#c9a24b; --gold2:#e6cd8a; --green:#2a7a52;
  --focus:#7cc4ff; --error:#e8615c; --error-bg:rgba(232,97,92,.12);
  --success:#4fae7e; --disabled:rgba(255,255,255,.28);
  --overlay:rgba(5,7,6,.72); --hover:rgba(255,255,255,.05);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:48px;
  --r-sm:10px; --r-md:16px; --r-lg:24px;
  --e1:0 2px 8px rgba(0,0,0,.24); --e2:0 12px 32px rgba(0,0,0,.4);
  --dur-fast:120ms; --dur-med:220ms;
  /* Nav geometry lives in one place. --nav-h is the visual bar; --nav-safe adds the
     device's home-indicator inset. Everything that must clear the nav references
     --nav-safe, so the bar height can never drift out of sync with content padding. */
  --nav-h:64px;
  --nav-safe:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:#05100b;color:var(--cream);
  font:400 15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.serif{font-family:Fraunces,Georgia,serif}

.stage{min-height:100vh;background:var(--bg)}
.device{width:100%;min-height:100vh;position:relative;overflow:hidden;background:var(--bg)}

/* Root scroll container. Deliberately a plain block box — no display:flex and no
   align-items here. Flexing the root is what previously collapsed the screens and let
   card content run under the nav; padding-bottom on the scroller is the correct fix. */
.app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav-safe) + var(--sp-5))}
.app--nonav{padding-bottom:0}

.screen{min-height:100%;animation:in var(--dur-med) cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}*{transition:none!important}}

.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;
  gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);
  background:rgba(10,14,12,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wordmark{flex:0 0 auto;border:0;background:none;color:var(--cream);
  font:500 20px/1 Fraunces,Georgia,serif;letter-spacing:-.01em;cursor:pointer;padding:var(--sp-2) 0}
.wordmark b{color:var(--gold2);font-weight:500}
.top .eyebrow{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.eyebrow{font-size:11px;line-height:1.2;letter-spacing:.12em;text-transform:uppercase;
  font-weight:600;color:var(--gold)}
.pad{padding:var(--sp-5)}
h1,h2,h3,p{margin-top:0}
h1[tabindex="-1"]:focus{outline:none}
h1{font:500 28px/1.15 Fraunces,Georgia,serif;letter-spacing:-.02em;overflow-wrap:anywhere}
h2{font:500 22px/1.2 Fraunces,Georgia,serif;overflow-wrap:anywhere}
h3{font-size:16px;line-height:1.3}
.sub{margin-bottom:var(--sp-4);font-size:13px;color:var(--muted)}

/* ---- Welcome hero: real photograph, wordmark pinned top, copy anchored bottom ---- */
.hero{min-height:100%;display:flex;flex-direction:column;justify-content:space-between;
  padding:var(--sp-6) var(--sp-5) var(--sp-7);
  background:
    linear-gradient(180deg,rgba(5,16,11,.50) 0%,rgba(5,16,11,.28) 22%,rgba(5,16,11,.62) 50%,
      rgba(5,16,11,.90) 72%,#050f0b 100%),
    url(assets/hero.jpg) center 42%/cover no-repeat,
    linear-gradient(168deg,#17573e 0%,#0d3527 42%,#081d15 78%,#050f0b 100%)}
.hero-mark{display:flex;align-items:center;gap:var(--sp-2)}
.hero-mark .wordmark{font-size:23px;
  text-shadow:0 2px 18px rgba(0,0,0,.75),0 0 40px rgba(0,0,0,.5)}
.hero-body{display:flex;flex-direction:column}
.hero h1,.hero p,.hero .eyebrow{text-shadow:0 2px 14px rgba(0,0,0,.6)}
.hero h1{font-size:42px;line-height:1.02;margin:var(--sp-3) 0 var(--sp-4)}
.hero h1 i{color:#f2e6c6}
.hero p{color:#dbe8de;margin-bottom:var(--sp-5)}

/* ---- Trust row: real list items with explicit rule separators.
   Previously three bare text nodes in a flex box — text nodes are not flex items, so
   `gap` did nothing and the three claims ran together as one string. ---- */
.trust{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-1) var(--sp-3);
  margin:var(--sp-2) 0 0;padding:0;list-style:none;
  font-size:11px;line-height:1.4;color:#d7e4da}
.trust li{display:flex;align-items:center;gap:6px;white-space:nowrap}
.trust li::before{content:"\25C6";color:var(--gold2);font-size:8px;line-height:1;
  text-shadow:0 1px 6px rgba(0,0,0,.6)}
.trust li+li{padding-left:var(--sp-3);border-left:1px solid rgba(242,238,228,.32)}

.btn{width:100%;min-height:48px;padding:var(--sp-3) var(--sp-4);border:1px solid transparent;
  border-radius:var(--r-md);font:600 16px/1.3 Inter,sans-serif;cursor:pointer;
  transition:transform var(--dur-fast),opacity var(--dur-fast),background var(--dur-fast);
  margin-bottom:var(--sp-3)}
.btn--primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1305;
  box-shadow:0 10px 24px rgba(201,162,75,.28)}
.btn--secondary{background:rgba(255,255,255,.10);color:#fff;border-color:rgba(255,255,255,.32)}
.btn--ghost{background:transparent;color:var(--gold2);border-color:var(--line-g)}
.btn--danger{background:transparent;color:var(--error);border-color:var(--error)}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:active{transform:scale(.98);opacity:.92}
button:disabled{opacity:.4;pointer-events:none;color:var(--disabled)}
@media(hover:hover){button:hover,.card:hover{background-color:var(--hover)}}

.surface{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--sp-4);box-shadow:var(--e1)}
.surface--accent{border-color:var(--line-g);background:linear-gradient(135deg,#123f2c,#0c2c1f)}
.search{display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);margin-bottom:var(--sp-3)}
.search input{min-width:0;width:100%;height:48px;border:0;background:transparent;color:var(--cream);
  font:400 15px Inter,sans-serif}
.search input::placeholder{color:var(--dim2)}
.chips{display:flex;gap:var(--sp-2);overflow-x:auto;padding-bottom:var(--sp-4);
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;white-space:nowrap;padding:var(--sp-2) var(--sp-3);
  border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);color:var(--cream);
  font:600 13px Inter,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{color:#1a1305;background:var(--gold);border-color:var(--gold)}

.card{display:block;width:100%;padding:0;overflow:hidden;text-align:left;
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);color:var(--cream);
  box-shadow:var(--e1);cursor:pointer;margin-bottom:var(--sp-4)}
.band{min-height:150px;position:relative;display:flex;flex-direction:column;
  justify-content:space-between;padding:var(--sp-4);overflow:hidden}
/* Each card's own photograph, full colour. The previous build blended every band with
   mix-blend-mode:luminosity, which desaturated all of them into the same grey-green
   wash and made distinct photos look like one reused tinted image. */
.band::before,.detail-hero::before{content:"";position:absolute;inset:0;
  background:var(--photo,none) center 50%/cover no-repeat}
.band::after,.detail-hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(6,12,9,.10) 0%,rgba(6,12,9,.30) 42%,
    rgba(6,12,9,.78) 78%,rgba(6,12,9,.92) 100%)}
.band>*,.detail-hero>*{position:relative;z-index:1}
.mono{position:absolute;right:var(--sp-3);bottom:-26px;z-index:1;
  font:600 104px/1 Fraunces,serif;color:rgba(255,255,255,.14)}
.badge{position:relative;z-index:1;align-self:flex-start;border:1px solid rgba(255,255,255,.22);
  border-radius:var(--r-sm);padding:var(--sp-1) var(--sp-2);font-size:11px;font-weight:600;
  background:rgba(6,12,9,.55)}
.badge--trophy{color:#1a1305;background:linear-gradient(90deg,var(--gold2),var(--gold));border:0}
.band h2,.band p{margin:0;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.band p{font-size:13px;color:rgba(255,255,255,.88)}
.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);
  padding:var(--sp-3) var(--sp-4);font-size:13px;color:var(--muted)}
.cardfoot>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{flex:0 0 auto;text-align:right;color:#fff;font-weight:600}
.price small{display:block;font-size:11px;color:var(--dim2);font-weight:400}
.club-list{display:block}
.empty{text-align:center;padding:var(--sp-8) var(--sp-4);color:var(--muted)}
.empty .crest{font:500 52px/1 Fraunces,serif;color:rgba(230,205,138,.4)}

/* ---- Bottom nav: fully opaque, safe-area aware, single source of height ---- */
.nav{position:absolute;z-index:5;bottom:0;left:0;right:0;
  height:var(--nav-safe);display:flex;align-items:flex-start;
  padding:var(--sp-2) var(--sp-1) env(safe-area-inset-bottom, 0px);
  background:var(--bg);border-top:1px solid var(--line);
  box-shadow:0 -8px 24px rgba(0,0,0,.45)}
.nav:empty{display:none}
.nav button{flex:1;min-width:44px;min-height:44px;border:0;background:none;color:var(--dim2);
  font:600 11px/1.2 Inter,sans-serif;cursor:pointer}
.nav button[aria-current="page"]{color:var(--gold2)}

.detail-hero{min-height:270px;display:flex;flex-direction:column;justify-content:flex-end;
  padding:var(--sp-5);position:relative;overflow:hidden}
.detail-hero h1,.detail-hero p{text-shadow:0 2px 12px rgba(0,0,0,.7)}
.section{padding:var(--sp-5);border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.section p{color:#c6d4c9}
.money{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);
  margin:0 0 var(--sp-2)}
.money span:last-child{flex:0 0 auto;color:var(--cream);font-variant-numeric:tabular-nums}
.money--total{margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--line);
  font-weight:600}
.row{width:100%;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;border:0;
  border-bottom:1px solid var(--line);background:none;color:var(--cream);text-align:left;
  font:400 15px Inter,sans-serif;cursor:pointer}
.row:last-child{border-bottom:0}
.row>span:last-child{min-width:0;overflow-wrap:anywhere}
.icon{display:grid;place-items:center;width:44px;height:44px;flex:0 0 auto;
  border-radius:var(--r-sm);background:var(--card2)}
.stack>*{margin-bottom:var(--sp-4)}
.stack>*:last-child{margin-bottom:0}
.confirm{margin:var(--sp-4) var(--sp-5);padding:var(--sp-4);
  border:1px solid rgba(79,174,126,.45);border-radius:var(--r-md);background:rgba(79,174,126,.1)}
.sheet{position:fixed;z-index:10;inset:0;display:flex;align-items:flex-end;background:var(--overlay)}
.sheet-card{width:100%;max-height:90%;overflow:auto;
  padding:var(--sp-6) var(--sp-5) calc(var(--sp-6) + env(safe-area-inset-bottom, 0px));
  border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--card);box-shadow:var(--e2)}
label{display:block;margin-bottom:var(--sp-2);font-size:13px;color:var(--muted)}
.field{width:100%;height:48px;margin-bottom:var(--sp-4);border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--card2);padding:var(--sp-3);color:var(--cream);
  font:400 15px Inter,sans-serif}
.field--error{border-color:var(--error)}
.error{margin-top:-8px;margin-bottom:var(--sp-3);padding:var(--sp-2);border-radius:var(--r-sm);
  background:var(--error-bg);color:var(--error);font-size:13px}

/* Desktop preview only: centre the app in a viewport-sized column. No device chrome. */
@media(min-width:760px){
  .stage{display:grid;place-items:center;padding:var(--sp-7)}
  .device{width:390px;height:844px;min-height:0;border-radius:var(--r-lg);
    box-shadow:0 44px 100px rgba(0,0,0,.6),0 0 0 1px var(--line-g)}
}
</style>
</head>
<body>
<div class="stage">
  <div class="device">
    <main class="app" id="app"></main>
    <nav class="nav" id="nav" role="tablist" aria-label="Primary navigation"></nav>
  </div>
</div>
<script>
'use strict';

/* Every club carries its OWN photograph. No shared/tinted image, no index maths. */
const CLUBS=[
 {id:0,name:'Cypress Hollow G&CC',location:'Scottsdale, AZ',tier:'Trophy',priceCents:28500,
  rating:'4.9',host:'Michael R.',initials:'MR',rounds:38,photo:'club-1.jpg',
  gradient:'linear-gradient(135deg,#1f5c40,#0e3527)',mono:'C',
  includes:['Caddie','Cart','Range','Clubhouse lunch'],
  about:'A top-100 desert course you almost never see without a member. Fast greens, ruthless bunkering, an unforgettable closing stretch through the arroyo.'},
 {id:1,name:'Marsh Point Club',location:'Charleston, SC',tier:'National',priceCents:24000,
  rating:'4.8',host:'Dana K.',initials:'DK',rounds:21,photo:'club-2.jpg',
  gradient:'linear-gradient(135deg,#1d5566,#112f3c)',mono:'M',
  includes:['Caddie','Cart','Lunch'],
  about:'Lowcountry links winding through tidal marsh and live oaks. A National-tier gem the membership guards closely.'},
 {id:2,name:'Ironwood National',location:'Dallas, TX',tier:'National',priceCents:21000,
  rating:'4.7',host:'Chris P.',initials:'CP',rounds:54,photo:'club-3.jpg',
  gradient:'linear-gradient(135deg,#3a5a2c,#20331b)',mono:'I',
  includes:['Cart','Range','Grill'],
  about:'Championship parkland with immaculate conditioning and generous corridors.'},
 {id:3,name:'The Dunes at Elk Ridge',location:'Monterey Peninsula, CA',tier:'Trophy',priceCents:65000,
  rating:'5.0',host:'William H.',initials:'WH',rounds:12,photo:'club-4.jpg',
  gradient:'linear-gradient(135deg,#20607a,#123a4a)',mono:'D',
  includes:['Forecaddie','Ocean holes','Locker','Lunch'],
  about:'Cliffside ocean holes and a waitlist measured in years.'},
 {id:4,name:'Oakmoor Country Club',location:'Atlanta, GA',tier:'Regional',priceCents:15000,
  rating:'4.6',host:'Steve L.',initials:'SL',rounds:71,photo:'club-5.jpg',
  gradient:'linear-gradient(135deg,#4a5a30,#28331c)',mono:'O',
  includes:['Cart','Range'],
  about:'A classic tree-lined club with a genuinely warm membership.'}
];
const SERVICE_FEE_CENTS=3900;

const state={filters:new Set(),query:'',requested:null,sheet:null};
const app=document.getElementById('app'),nav=document.getElementById('nav');

function el(tag,props={},...kids){
  const node=document.createElement(tag);
  for(const [key,value] of Object.entries(props)){
    if(key==='className')node.className=value;
    else if(key==='text')node.textContent=value;
    else if(key.startsWith('on'))node.addEventListener(key.slice(2).toLowerCase(),value);
    else if(value!==false&&value!=null)node.setAttribute(key,value===true?'':value);
  }
  for(const kid of kids.flat()){
    node.append(kid?.nodeType?kid:document.createTextNode(kid??''));
  }
  return node;
}
function photoFor(c){return 'assets/'+c.photo}
function bandStyle(c){return 'background:'+c.gradient+';--photo:url('+photoFor(c)+')'}
function formatMoney(cents){
  return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0})
    .format(cents/100);
}
function route(path){location.hash='#/'+path}
function current(){return location.hash.replace(/^#\//,'')||'welcome'}

function wordmark(onActivate){
  return el('button',{className:'wordmark',onClick:onActivate,'aria-label':'Teed Up home'},
    'Teed',el('b',{text:'Up'}));
}
function header(label='Scottsdale, AZ'){
  return el('header',{className:'top'},
    wordmark(()=>route('welcome')),
    el('span',{className:'eyebrow',text:label}));
}
function button(label,variant,click,disabled=false){
  return el('button',{className:'btn '+variant,onClick:click,disabled,text:label});
}
function moneyRow(label,value,total=false){
  return el('p',{className:'money'+(total?' money--total':'')},
    el('span',{text:label}),el('span',{text:value}));
}

function card(c){
  const band=el('div',{className:'band',style:bandStyle(c)},
    el('span',{className:'mono','aria-hidden':'true',text:c.mono}),
    el('span',{className:'badge '+(c.tier==='Trophy'?'badge--trophy':''),text:c.tier}),
    el('div',{},el('h2',{text:c.name}),el('p',{text:c.location})));
  return el('button',{className:'card',onClick:()=>route('club/'+c.id),
    'aria-label':c.name+', '+c.tier+', '+formatMoney(c.priceCents)+' guest fee'},
    band,
    el('div',{className:'cardfoot'},
      el('span',{text:'\u2605 '+c.rating+' \u00b7 '+c.host}),
      el('span',{className:'price'},formatMoney(c.priceCents),
        el('small',{text:'guest fee \u00b7 reimbursed'}))));
}

/* Welcome: wordmark restored at the top of the hero, trust claims as a real list. */
function welcome(){
  return el('section',{className:'screen hero'},
    el('div',{className:'hero-mark'},wordmark(()=>route('discover'))),
    el('div',{className:'hero-body'},
      el('div',{className:'eyebrow',text:'Members-hosted golf'}),
      el('h1',{className:'serif'},'Get inside the ',el('i',{text:'ropes.'})),
      el('p',{text:'Book the private clubs you can\u2019t normally play \u2014 as the verified guest of a member.'}),
      button('Explore clubs','btn--primary',()=>route('discover')),
      button('I\u2019m a member \u2014 host','btn--secondary',()=>route('host')),
      el('ul',{className:'trust'},
        el('li',{text:'ID verified'}),
        el('li',{text:'Handicap checked'}),
        el('li',{text:'Rated both ways'}))));
}

function discover(){
  const body=el('div',{className:'pad'},
    el('div',{className:'eyebrow',text:'Discover'}),
    el('h1',{text:'Inside the ropes'}),
    el('p',{className:'sub',text:'Verified members hosting rounds near you.'}));
  const screen=el('section',{className:'screen'},header(),body);

  const search=el('div',{className:'surface search'},el('span',{text:'\u2315','aria-hidden':'true'}));
  const input=el('input',{type:'search',placeholder:'Search clubs, cities, dates','aria-label':'Search clubs'});
  input.value=state.query;
  const list=el('div',{className:'club-list'});
  input.addEventListener('input',()=>{state.query=input.value;renderCards(list)});
  search.append(input);

  const chips=el('div',{className:'chips','aria-label':'Filters'});
  ['All tiers','Trophy','National','Regional','Caddie'].forEach(name=>{
    const pressed=name==='All tiers'?state.filters.size===0:state.filters.has(name);
    const chip=el('button',{className:'chip','aria-pressed':String(pressed),text:name});
    chip.addEventListener('click',()=>{
      if(name==='All tiers')state.filters.clear();
      else if(state.filters.has(name))state.filters.delete(name);
      else state.filters.add(name);
      render();
    });
    chips.append(chip);
  });

  body.append(search,chips,
    el('div',{className:'surface surface--accent',
      text:'No club? No connections? Every host is a verified member; every guest is vetted and rated.'}),
    el('div',{style:'height:var(--sp-4)'}),
    list);
  renderCards(list);
  return screen;
}

function renderCards(list){
  list.replaceChildren();
  const q=state.query.toLowerCase();
  const items=CLUBS.filter(c=>
    (!state.filters.size||state.filters.has(c.tier))&&
    [c.name,c.location,c.tier].join(' ').toLowerCase().includes(q));
  if(!items.length){
    list.append(el('div',{className:'empty'},
      el('div',{className:'crest','aria-hidden':'true',text:'T'}),
      el('h3',{text:'No clubs match those filters yet'}),
      el('p',{text:'Try a different search or clear your filters.'}),
      button('Clear filters','btn--ghost',()=>{state.filters.clear();state.query='';render()})));
    return;
  }
  items.forEach(c=>list.append(card(c)));
}

function detail(id){
  const c=CLUBS[id]||CLUBS[0];
  const total=c.priceCents+SERVICE_FEE_CENTS;
  const screen=el('section',{className:'screen'},
    header(c.location),
    el('div',{className:'detail-hero',style:bandStyle(c)},
      el('span',{className:'mono','aria-hidden':'true',text:c.mono}),
      el('span',{className:'badge '+(c.tier==='Trophy'?'badge--trophy':''),text:c.tier}),
      el('h1',{text:c.name}),
      el('p',{text:'\u2605 '+c.rating+' \u00b7 Hosted by '+c.host})),
    el('div',{className:'section'},
      el('div',{className:'eyebrow',text:'The course'}),
      el('p',{text:c.about})),
    el('div',{className:'section'},
      el('div',{className:'eyebrow',text:'What\u2019s included'}),
      el('p',{text:c.includes.join(' \u00b7 ')})),
    el('div',{className:'section'},
      el('div',{className:'eyebrow',text:'Price'}),
      moneyRow('Guest fee (reimbursed to host)',formatMoney(c.priceCents)),
      moneyRow('Teed Up service fee',formatMoney(SERVICE_FEE_CENTS)),
      moneyRow('Total',formatMoney(total),true)));

  const action=state.requested===c.id
    ? el('div',{className:'confirm'},
        el('h3',{text:'Request sent'}),
        el('p',{className:'sub',text:c.host+' usually responds in under 2 hours.'}),
        button('Message '+c.host,'btn--ghost',()=>route('messages')))
    : el('div',{className:'section'},
        button('Request to book \u00b7 '+formatMoney(total),'btn--primary',
          ()=>{state.requested=c.id;render()}));
  screen.append(action);
  return screen;
}

function host(){
  const rows=['Cypress Hollow G&CC \u00b7 Your verified home club','Sat, Sep 20 \u00b7 8:40 AM',
    'Guest fee \u00b7 Cart & caddie','Guest requirements'];
  const icons=['\u26f3','\u25c8','\u25ce','\u2713'];
  return el('section',{className:'screen'},
    header('Member \u2713'),
    el('div',{className:'pad stack'},
      el('div',{},
        el('div',{className:'eyebrow',text:'Host'}),
        el('h1',{text:'List an open spot'}),
        el('p',{className:'sub',
          text:'Share a round with a vetted guest. You approve who plays and set the terms.'})),
      el('div',{className:'surface'},...rows.map((x,i)=>
        el('button',{className:'row',onClick:()=>openSheet('Edit listing',x)},
          el('span',{className:'icon','aria-hidden':'true',text:icons[i]}),
          el('span',{text:x})))),
      el('div',{className:'surface surface--accent'},
        el('h3',{text:'Reimbursements this month'}),
        el('p',{text:'4 rounds hosted \u00b7 Reimbursed $1,140'})),
      button('Publish this spot','btn--primary',
        ()=>openSheet('Listing published','We\u2019ll notify you when a vetted golfer requests it.'))));
}

function rounds(){
  return el('section',{className:'screen'},
    header('Elite \u2726'),
    el('div',{className:'pad stack'},
      el('div',{},
        el('div',{className:'eyebrow',text:'Your rounds'}),
        el('h1',{text:'Upcoming'}),
        el('p',{className:'sub',text:'Everything handled \u2014 not just a tee time.'})),
      card(CLUBS[0]),
      el('div',{className:'surface'},
        el('h3',{text:'Concierge'}),
        el('p',{className:'sub',
          text:'Buddies trips, corporate outings, transport and lodging are available from your concierge.'}),
        button('Message concierge','btn--secondary',()=>route('messages')))));
}

function profile(){
  return el('section',{className:'screen'},
    header('\u2605 4.9'),
    el('div',{className:'pad stack'},
      el('div',{},
        el('div',{className:'eyebrow',text:'Profile'}),
        el('h1',{text:'Brad V.'}),
        el('p',{className:'sub',text:'Guest \u00b7 GHIN 8.2 \u00b7 Trust score 92'})),
      el('div',{className:'surface'},
        el('h3',{text:'Verified'}),
        el('ul',{className:'trust'},
          el('li',{text:'Photo ID'}),
          el('li',{text:'Handicap'}),
          el('li',{text:'Etiquette'}))),
      button('Add a reference','btn--secondary',
        ()=>openSheet('Add a reference','Name, relationship, and contact form belongs here.')),
      el('div',{className:'surface'},
        el('h3',{text:'Membership'}),
        el('p',{className:'sub',text:'Standard \u00b7 Current plan'}),
        button('Current plan','btn--ghost',()=>{},true),
        button('Upgrade to Plus','btn--primary',
          ()=>openSheet('Choose Plus','Checkout is a prototype sheet only; payment processing is not connected.')),
        button('Upgrade to Elite','btn--secondary',
          ()=>openSheet('Choose Elite','Checkout is a prototype sheet only; payment processing is not connected.')))));
}

function messages(){
  return el('section',{className:'screen'},
    header('Messages'),
    el('div',{className:'pad stack'},
      el('h1',{text:'Messages'}),
      el('div',{className:'surface'},
        el('h3',{text:'Michael R.'}),
        el('p',{className:'sub',text:'Happy to answer questions about Cypress Hollow.'}),
        button('Open conversation','btn--secondary',
          ()=>openSheet('Message Michael','Messaging is a client-demo state. No messages are sent.')))));
}

function auth(){
  return el('section',{className:'screen'},
    header('Welcome'),
    el('div',{className:'pad'},
      el('div',{className:'eyebrow',text:'1 of 3'}),
      el('h1',{text:'Tell us about you'}),
      el('p',{className:'sub',text:'Demo-only onboarding. Production must require verification.'}),
      el('label',{for:'auth-id',text:'Email or phone'}),
      el('input',{className:'field',id:'auth-id',type:'email',placeholder:'you@example.com'}),
      button('Continue','btn--primary',()=>route('discover'))));
}

function openSheet(title,body){state.sheet={title,body};render()}
function sheet(){
  if(!state.sheet)return null;
  const extras=/Choose|reference/.test(state.sheet.title)
    ? [el('label',{for:'sheet-email',text:'Email for demo confirmation'}),
       el('input',{className:'field',id:'sheet-email',type:'email',placeholder:'you@example.com'})]
    : [];
  return el('div',{className:'sheet',role:'dialog','aria-modal':'true','aria-label':state.sheet.title},
    el('div',{className:'sheet-card'},
      el('h2',{text:state.sheet.title}),
      el('p',{className:'sub',text:state.sheet.body}),
      ...extras,
      button('Done','btn--primary',()=>{state.sheet=null;render()}),
      button('Close','btn--ghost',()=>{state.sheet=null;render()})));
}

const VIEWS={welcome,discover,host,rounds,profile,messages,auth};
const TABS=[['discover','Discover'],['rounds','Rounds'],['host','Host'],['profile','Profile']];

function render(){
  const path=current(),parts=path.split('/');
  const view=parts[0]==='club'?detail(Number(parts[1])):(VIEWS[parts[0]]||welcome)();
  app.replaceChildren(view);

  /* Welcome has no tab bar, so it must not reserve the nav's height either. */
  const showNav=parts[0]!=='welcome';
  app.classList.toggle('app--nonav',!showNav);
  nav.replaceChildren();
  if(showNav){
    TABS.forEach(([key,label])=>nav.append(el('button',{
      role:'tab','aria-current':parts[0]===key?'page':null,text:label,onClick:()=>route(key)})));
  }

  if(state.sheet)app.append(sheet());
  const heading=app.querySelector('h1');
  if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}
}

window.addEventListener('hashchange',render);
render();
</script>
